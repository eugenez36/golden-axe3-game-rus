# rom_map.yml — the single home of every ROM offset in this project.
#
# Segments are listed in ascending order, `end` is exclusive, and every
# integer is written with a 0x prefix (the loader rejects anything else).
# Gaps between segments are reported as `unknown` by `ga3 map`; driving that
# number down is the reverse-engineering backlog.
#
# Types
#   header     vector table / cartridge header      -> assets/header/*.yml
#   code       68000 code (extracted for browsing, taken from the base ROM on build)
#   data       misc data, same treatment as code
#   table      small numeric table                  -> assets/data/*.yml
#   text       strings in the font's byte layout    -> assets/text/*.txt
#   nemesis    Nemesis-compressed tiles             -> assets/gfx/nemesis/*.nem (+ .4bpp)
#              format: font_art -> path is text art, blob is the derived .nem
#   tiles4bpp  uncompressed 4bpp tiles              -> assets/gfx/tiles/*.png (indexed)
#   pcm        raw sample data                      -> assets/sound/pcm/*.pcm
#   free       filler verified to hold `fill`; candidate space for relocated data
#   patch      generated 68000 routine (ga3.patches) in former free space, plus a
#              jmp hook over six bytes elsewhere; nothing is extracted
#   (palettes do sit in ROM -- the title's at 0EB200, 0EB278, 0EB2A2, inside
#    text_dialogue; patch menus points the game at new ones instead of editing
#    them. The captures under `palettes:` below remain a rendering reference)
#
# Per-segment keys (beyond name/start/end|size/type/path)
#   note, evidence   free text; `evidence` says how an address was proven (CONTRIBUTING rule 3)
#   text:            min_len (shortest run of printable bytes that counts as a string)
#   table:           format (u8|u16|u32), fields (one name per entry), max_hud (warn above it),
#                    range [lo, hi] (refuse values outside), hex (write values as 0x..)
#   nemesis:         tiles, xor (checked against the block header); font_art adds
#                    blob (the derived .nem), first_byte, bg, ink
#   tiles4bpp:       sheet_tiles (per PNG), cols, prefix (file stem), palette (NAME[/INDEX])
#   free:            fill (the byte the whole range must hold)
#   patch:           routine, hook, hook_bytes (base ROM bytes at hook, hex), fill,
#                    plus the routine's parameters (menu_version: return_to, vram_end, attr)
# The `rom:` block: title, serial, size, sha1, md5, header_checksum, entry_point --
# size, sha1, serial, header_checksum and entry_point are enforced by `ga3 map --check`.
# Nemesis `end` values are the exact block size plus the base ROM's 0–2 bytes
# of zero word-alignment padding, measured with `ga3 nemesis size`.

rom:
  title: "Golden Axe 3 (RUS) — NEWGAME 2003"
  serial: "GM 00004093-00"
  size: 0x100000                 # the base ROM (the dump `map --check` compares)
  build_size: 0x200000           # the build is expanded to 2 MiB; 100000-1FFFFF is new free space
  sha1: e9538c0542b4a05050f5b68d279cddb06559ae20
  md5: eae35fbc0f915048cead589db377407f
  header_checksum: 0x9BB5
  entry_point: 0x0FFA20          # translators moved it from the stock 0x200

palettes:                        # CRAM captured in the emulator (the game DMAs CRAM from RAM, F200)
  title:            { path: palettes/title.pal,            source: "emu/scenes/title.txt, title screen" }
  title_menu:       { path: palettes/title_menu.pal,       source: "emu/scenes/title.txt, menu after START" }
  title_newgame:    { path: palettes/title_newgame.pal,    source: "emu/scenes/title.txt, second menu state" }
  stage1_intro:     { path: palettes/stage1_intro.pal,     source: "emu/explore/enter.txt, e3 (attract walk)" }
  stage1:           { path: palettes/stage1.pal,           source: "emu/explore/enter.txt, e4" }
  stage1_dialogue:  { path: palettes/stage1_dialogue.pal,  source: "emu/scenes/dialogue.txt, first NPC dialogue" }

patches:                         # assembled patches: source in assets/patches/, one segment per section
  kill_counter:
    source: patches/kill_counter.s
    symbols:
      HP: 0x142                    # object: hit points (byte)
      LAST_HIT: 0x15D              # object byte the game never writes: player who hit it last (1/2)
      FREE_BACK: 0x00C800          # object clear routine, after the bytes the free hook replaced
      P1: 0xC7A4                   # player 1 object
      P2: 0xC904                   # player 2 object
      CASTER: 0xDC4E               # magic in progress: 0 player 1, 1 player 2, 2+ enemies (word)
      MAGIC_BACK: 0x00F8C6         # magic damage loop, after the HP update
      KILLS: 0xC3E0                # counters: player 1, player 2 (words; never cleared by the game)
      KILLS_MAX: 999               # a counter stops here (three digits)
      SHOWN: 0xC3E4                # number in each player's digit tiles, FFFF: upload again (words)
      MODE_SRC: 0xF160             # main-menu cursor
      MODE: 0xF176                 # chosen game mode
      DUEL: 2                      # MODE from here up is a duel (2 against the computer, 3 against player 2)
      VBLANK_FLAG: 0xC70A
      WAIT_BACK: 0x00F010          # frame wait, after the flag is cleared
      SPRITES: 0xE5CA              # sprite list in Work RAM, DMA'd to the SAT every VBlank
      SPR_COUNT: 0xEE70            # sprites in the list this frame (word; the game adds them in order)
      MAX_SPRITES: 80
      HUD_SCAN: 8                  # HUD blocks are among the first sprites of the list
      HUD_SIZE: 0x0E               # their third block is 4 x 3 cells
      HUD_P1: 0x33E                # tile of player 1's third HUD block
      HUD_P2: 0x36A                # tile of player 2's third HUD block
      COUNTER_DX: 10               # counter sprite: just right of the magic boxes
      COUNTER_DY: 12               # centred on the magic boxes
      COUNTER_SIZE: 0x08           # 3 x 1 cells
      DIGITS_VRAM: 0xDF00          # 6 tiles: player 1 at 6F8-6FA, player 2 at 6FB-6FD
      COUNTER_ATTR: 0x86F8         # priority, palette 0, tile 6F8 (DIGITS_VRAM / 32)
      TICK: 0xC3EA                 # frames until the digit tiles are uploaded again (byte)
      VDP_CTRL: 0xC00004
      VDP_DATA: 0xC00000
      POT: 0xC729                  # patch options: bit LIFE_BIT is OPTIONS -> 100 ВРАГОВ (0 at power-on: off)
      LIFE_BIT: 7
      LIFE_KILLS: 100              # kills for each extra life
      DEMO: 0xC718                 # bit 0: the attract-mode demo is playing
      LIVES: 0x13C                 # object: spare lives (constants.lives)
      LIVES_MAX: 9                 # constants.lives max_hud: the HUD shows one digit
      ICONS: 0x138                 # object: prisoner icons the HUD draws (copied from +0x13E, the prisoners)
      ICONS_SRC: 0x010401          # the operand of move.b #5,$138(a1) at 0103FE: the prisoners a life costs (constants.prisoners), icons shown and blinks
      P1_STATE: 0xDC24             # HUD state of player 1 (16 bytes), run every frame by 0103B4
      P2_STATE: 0xDC34             # HUD state of player 2
      BLINK: 0x0C                  # HUD state: blinking (byte), +1 frames to the next toggle, +2 toggles left
      BLINK_FRAMES: 0x0F
      SOUND: 0x00E4B2              # queue sound d0.b (keeps every register)
      SOUND_LIFE: 0xDF             # the extra-life sound
    hooks:                         # [address, base-ROM bytes (hex), label]: each becomes jmp label.l
      count:
        - [0x000E04, "93 28 01 42 6A 04", melee_a0]   # sub.b d1,$142(a0); bpl
        - [0x000E74, "93 29 01 42 6A 04", melee_a1]   # sub.b d1,$142(a1); bpl
        - [0x00F8BC, "91 28 01 42 6A 04", magic]      # sub.b d0,$142(a0); bpl
        - [0x014FF6, "31 F8 F1 60 F1 76", new_game]   # move.w $f160.w,$f176.w
        - [0x00C7F8, "22 48 74 00 32 28", on_free]    # movea.l a0,a1; moveq #0,d2; move.w $e(a0),d1 (first word)
      hud:
        - [0x00F006, "46 FC 20 00 08 B8", frame]      # move #$2000,sr; bclr #0,$c70a.w (first word)
    glyphs: { section: tiles, art: gfx/font/font.txt, chars: "0123456789 ", ink: 0x06, bg: 0x0C }
    evidence: "objects: disasm 00EA28-00EA5A (slots 0x160 apart), magic bp 00F874 a2=FFC7A4 a3=FFC904; HP +0x142: watch -> 000E74 (enemy hits the player), magic kill 00F8BC/00F8C2 then 00C808 frees the slot; caster: disasm 00F62E ($dc4e selects c7a4/c904); mode: disasm 014FEA-014FFC; frame wait: disasm 00F006; sprite list: dmalog src FFE5CA dst BC00 len 0140 (VBlank 0109E6), HUD sprites 31E/32E/33E and 34A/35A/36A in a 2P game; VRAM D700-DFFF: vwatch over all 13 stages (level select), no write after the stage starts (wrong: the window table D000-DFFF is off in play, VDP regs 2-4/17-18, and the game DMAs objects' frames into D700-DEFF at 010990 from 0D5CEE-0D7DEE, stages 2 and 3A among others; DF00-DFFF: vwatch over the 13 stages, 450 bot rounds with spells each, written only by the counter and the clear 0122D6 between stages); TICK FFC3EA in the FFC000-FFC765 range; palette 0 identical on all 13 stages (colour 6 white, 12 blue); KILLS: watch FFC000-FFC765 over stages 1/3B/5B/8, never written after boot; LAST_HIT +0x15D: watch in all enemy slots over all 13 stages, written only by the object clear (00C80E); sprite count: watch FFEE70 (cleared each frame by 00D896, raised by the builders 00C8FC/00C964/00CA4C, which link sprite n to n+1), the game ends the list at 000044 from $EE70 just before 00F006; duel: MODE after the menu is 0 for 1 player, 1 for 2 players, 2 for a duel against the computer and 3 once player 2 joins it (dump after each, emulator); 014FEA never copies the options item (cursor 3) to MODE; KILLS FFC3E0-3 and SHOWN FFC3E4-7 (words): in the FFC000-FFC765 range never written after boot; HUD art: VRAM dumped every frame across a spell and a stage start (2P, stage 1): the game clears tiles 31E-36D while a spell fills the screen and reloads them 6-12 frames after the HUD sprites return, one block at a time, each block starting with a non-zero border word; falls: stage 5A, an enemy hit to HP 4 flies off the ledge and its slot is freed through 00C7F8 with HP left (no other code writes enemy HP)"
  hero_panel:
    source: patches/hero_panel.s
    symbols:
      CURSOR_BACK: 0x016280        # cursor routine, after the six bytes the hook replaced
      CURSOR_P1: 0xF300            # player 1's cursor block (+0x14 cursor); player 2's at 0xF380
      MODE: 0xF176                 # 0 one player, 1 two players, 2+ duel
      DUEL: 2
      SHOWN: 0xC3E8                # hero shown in each player's panel (bytes; FF: draw again)
      PLANE_A: 0xC000              # plane A on the select screen (VDP register 2 = 0x30)
      PLANE_ROW: 128               # bytes a row (64 cells, register 16 = 0x01)
      VDP_CTRL: 0xC00004
      VDP_DATA: 0xC00000
    hooks:
      panel:
        - [0x016278, "31 40 00 14 C0 FC", cursor]   # move.w d0,$14(a0); mulu.w #6,d0 (first word)
    panel: { section: panel, art: gfx/font/font.txt, data: data/hero_panel.yml, vram: 0x3C40, max_tiles: 118 }
    evidence: "cursor routine 0161F0-0162A6 runs once a frame for each player's block (a0 = F300 / F380) and writes the cursor at 016278 (watch FFF314/FFF394 while moving both cursors); the select screen's VDP registers: plane A C000, plane B E000, SAT B800, window off, 64x32 planes; the title is plane A rows 3-5 (palette 3), the lava plane B (palette 2); palette 0 holds white 6, blue C, yellow D, black 9 and is the same for every cursor position; VRAM 3C40-4AFF (118 tiles) is zero and never written from boot to the end of the select screen, one and two players (vwatch); SHOWN FFC3E8-9 is in the FFC000-FFC765 range the game never writes after boot"

  difficulty:
    source: patches/difficulty.s
    symbols:
      DIFF: 0xC726                 # options: difficulty (0 normal, 1 hard, 2 the new one; kept over a soft reset)
      HARD: 2
      NAME_WIDTH: 6                # characters of each name in the options menu
      MENU_CELL: 0xC430            # plane cell of the difficulty value on the options screen
      TO_VDP: 0x01202E             # d0 (cell) -> VDP write command
      DEMO: 0xC718                 # bit 0: the attract-mode demo is playing
      GATE_BACK: 0x00C1C8          # spawn walker: the beq after `btst #0,DEMO.w`
      SPAWN_D1: 0xC412             # the spawning entry's second long, low word
      SPAWN_BACK: 0x00C204         # spawn of a plain entry, after the six bytes the hook replaced
      SPAWN_ONE: 0x00C0FE          # spawn one entry d0/d1 (placement in d0's top 12 bits)
      ENEMY_SLOT: 0x00BD60         # find a free enemy slot: Z set and a1 when found
      ALLOC_BACK: 0x00C1FE         # plain entry: a slot was found
      SPAWNER: 0xDC68              # the spawner's state block (a6 of the routines above)
      FRAME_GO: 0x00BDC6           # spawner frame routine: run the current state
      FRAME_SKIP: 0x00BE1A         # spawner frame routine: rts (spawner held)
      ENEMIES: 0xCA64              # first enemy object
      ENEMY_SLOTS: 4
      OBJ_SIZE: 0x160
      WAVE_BACK: 0x00C674          # "wave cleared" check, after its lea/moveq
      EMPTY_BACK: 0x00C656         # "no enemy left" check, after its lea/moveq
      STATE: 0xDC44                # game state block cleared by 00E552
      STATE_WORDS: 0x9CE
      CLEAR_BACK: 0x00E55A         # the clearing loop
      Q_COUNT: 0xBF00              # copies waiting (byte); FFBCC0-FFBFFF: never written after boot
      Q_HEAD: 0xBF01               # oldest copy's index (byte)
      COPYING: 0xBF02              # 1 while a copy is being spawned (byte)
      Q_DATA: 0xBF08               # Q_LEN entries of 8 bytes, a ring
      Q_LEN: 16
      ITEM: 0x4C                   # object type of an item a gnome drops
      KIND: 0x42                   # gnome: the kind of item it carries (0 potions, 1-2 meat)
      FRAME: 0x14                  # object: sprite frame; an item's frame is its kind
      SPAWN_ITEM: 0x006DEE         # spawn object d4 at a1 where a0 is (d5 to +0x8F)
      ITEM_SLOT: 0x00BCCA          # find a free item slot (FFD584, 8 of 0xB4): Z set and a1
      LAST_FLIGHT: 8               # an item's +0x8F indexes 9 flights at 0EFAD8 (8 bytes each)
      GAP: 0xBF03                  # frames until the next copy may come in (byte)
      GAP_FRAMES: 40
      WAIT: 0xBF04                 # frames the queue head found no ground (byte)
      WAIT_FRAMES: 240
      PLAYER1: 0xC7A4              # player objects: the reference for depth and ground
      PLAYER2: 0xC904
      DEPTH: 0x26                  # object: depth position (word)
      FLOOR: 0x74                  # object: top of the highest box under it (word)
      CAMERA: 0xDCA4               # camera X (word)
      STAGE: 0xC778                # stage and part indices (words)
      SUBSTAGE: 0xC77A
      TERRAIN: 0x02DE5A            # collision boxes: stage -> part -> 64-pixel column -> box list
      UP: 120                      # a copy's ground at most this far above the player's
      DOWN: 16                     # ... and at most this far below it
      BODY: 64                     # free height over that ground
      END_X: 0x7FFF                # ends the X offset lists
    hooks:
      menu:
        - [0x0152E4, "D3 38 C7 26 02 38", menu]        # add.b d1,$c726.w; andi.b #1,$c726.w (first word)
      spawn:
        - [0x00C1BE, "1C 38 C7 26 08 38", gate]        # move.b $c726.w,d6; btst #0,$c718.w (first word)
        - [0x00C1F6, "4E BA FB 68 67 02", alloc]       # jsr $bd60(pc); beq.b $c1fe
        - [0x00C1FE, "32 38 C4 12 E2 49", spawned]     # move.w $c412.w,d1; lsr.w #1,d1
        - [0x00BDBA, "4D F8 DC 68 08 2E", frame]       # lea $dc68.w,a6; btst #1,2(a6) (first word)
        - [0x00C66E, "43 F8 CA 64 7E 03", wave_clear]  # lea $ca64.w,a1; moveq #3,d7
        - [0x00C650, "43 F8 CA 64 7E 03", no_enemy]    # lea $ca64.w,a1; moveq #3,d7
        - [0x00E552, "41 F8 DC 44 30 3C", reset]       # lea $dc44.w,a0; move.w #$9cd,d0 (first word)
      drop:
        - [0x0098B8, "78 4C 13 68 00 42", drop]        # moveq #$4c,d4; move.b $42(a0),$14(a1) (first 4 bytes)
    strings: { section: names, path: text/difficulty.txt, label: NAMES }
    evidence: "difficulty $C726: options left/right 0152AE -> table 0152D8 item 0 -> 0152E4 add.b d1/andi.b #1 (emulator: 2 wraps to 0, FF to 1), drawn by 0152EE (lea $15318 + 6, cell C430 via 01202E, 6 x $E000+c); bsr from 0152C8 and 015110 (screen entry, d1 = 0); kept over a soft reset (0002CC/0002E8); the only gameplay reader is 00C1BE in the spawn walker: entry level = bits 31..30 of d1, skipped above $C726 (0 when $C718 bit 0, the demo; +1 when $C408 = 3, both player objects present: 007100); poking $C726 = 2 spawns level-2 entries. Spawning: 00C0FE (placement in d0 bits 31..20: 1 cam+150, 2 cam-10, 3 cam+X, 0 absolute), plain entries (d1 bits 5..0 = 0) get a slot from 00BD60 at 00C1F6 (none: rts, the entry is dropped; state 0D at 00BFE6 retries while bit 4 of 2(a6) stays clear) and are written at 00C1FE-00C226 (X = d3 high word); commands through 00C244; spawner frame routine 00BDA4 (skipped while $DC4A, magic) with a6 = $DC68; wave cleared 00C66E, all enemy slots empty 00C650; 00E552 clears $DC44-$F0E0 at every stage start (watch FFDC68). Ordinary types: handler 007954 via 007618; bosses 32/2E/1E. Queue RAM FFBCC0-FFBFFF: zero in WRAM dumps every 200 bot iterations over all 13 stages, watch: written only by 0FFA7C/0002DA at power-on; FFC480-FFC5FF is the Nemesis table (0FFC64/0123F8, every decompression), FFC600-FFC701 the stack (SSP FFC702). Bot runs: every ordinary enemy of stage 1 spawned exactly twice (41 pairs), boss 32 once; level select on 13 stages: the new value finished every stage the same bot finished on hard; demo spawns identical to the unpatched build. Where a copy comes in (section place): the physics step 002C14 calls 002CAC (lea $2DE5A; + word at stage $C778*2, + word at part $C77A*2, + word at (X>>6)*2 = the column list; its words are offsets from the list to boxes, bit 15 on the last), 002E8E reads a box as X, depth, height (centre, half size) and a type word, lands an object only when it entered the box by at most one frame of fall (002F04-002F22), and 002EE4-002EEE keeps the highest box top at or under the object in +0x74; stage 1 (3/0) at X 0x365: box 918+-18, top 936, the player stands at 937 (dumps); copies at the original's spot: 97 of 510 fell below their floor or stayed off screen in a 13-stage bot (dumps twice a round), on stage 8 two stood inside the floor and the wave never ended; at the edge on ground: 21 of 411, no wave waits (also 2 players, 4 stages); the first column offset of every column table met (25 stage/part pairs) is the table size (stage 10 part 0: 14 columns while the camera reaches 736); GAP FFBF03 and WAIT FFBF04 in the free FFBCC0-FFBFFF; Gnome drop: watch on the type and frame bytes of the 8 item slots FFD584 (0xB4 apart, walked at 000A82; ITEM_SLOT 00BCCA) on stage 1: frame 0 written by 0098BA, type 4C by 006DEE; 0098A0-0098C0 runs when a player hits a gnome carrying items (+0x43 count from $EF3E/$EF3F at 009BB0, +0x44 dropped, +0x42 kind); the pick-up 0009E2 reads the frame (0 potion -> 000A16, at most 6); +0x8F indexes the 9 flights at 0EFAD8 (0084B6); at the hardest level each hit spawned two potion objects (bot, 4 hits)"
  options:
    source: patches/options.s
    symbols:
      CURSOR: 0xF160               # options cursor: 0..4 in the game, ITEMS-1 with this patch (word)
      ITEMS: 7                     # СЛОЖНОСТЬ, КНОПКИ, МУЗ., ЗВУК, БАНКИ МАГИИ, 100 ВРАГОВ, МЕНЮ
      POT_ITEM: 4
      LIFE_ITEM: 5
      MENU_ITEM: 6
      ROWS: 18                     # cursor column cleared from row 8 to row 0x19 (the game: 15, to 0x16)
      CURSOR_CLEAR: 0x440E0003     # VDP write command of plane cell C40E (row 8, column 7)
      CURSOR_CELL: 0xC00E          # plane cell of the cursor at row 0, column 7
      FILL: 0x01207C               # fill d2+1 rows of d1+1 cells from command d0 with d4
      TO_VDP: 0x01202E             # d0 (cell) -> VDP write command
      LABEL_WIDTH: 11              # characters of each new label (text/options.txt)
      VALUE_WIDTH: 4               # characters of each value of 100 ВРАГОВ: ВЫКЛ, ВКЛ
      MUS_CELL: 0xC7B0             # plane cell of the МУЗ. value: row 0x0F, column 0x18 (the game: C830, row 0x10)
      SND_CELL: 0xC8B0             # plane cell of the ЗВУК value: row 0x11 (the game: C9B0, row 0x13)
      POT_LABEL: 0xC990            # plane cell of the label: row 0x13, column 8
      POT_CELL: 0xC9B0             # plane cell of the value: row 0x13, column 0x18 (under МУЗ./ЗВУК values)
      LIFE_LABEL: 0xCA90           # 100 ВРАГОВ: row 0x15, column 8
      LIFE_CELL: 0xCAB0            # its value: row 0x15, column 0x18
      POT: 0xC729                  # bits 0-6: potions minus the default, 0..6; bit 7: 100 ВРАГОВ (byte; kept over a soft reset, 0 at power-on)
      POT_MASK: 0x7F
      LIFE_BIT: 7
      LIFE_FLAG: 0x80
      POT_MAX: 6                   # what the HUD can draw (constants.potions max)
      DEFAULT: 0x00E47F            # operand of `move.b #N,$140(a0)`: the constant `potions`
      DEMO: 0xC718                 # bit 0: the attract-mode demo is playing
      DEMO_POTIONS: 1              # the base game's count, which the demo's recorded input expects
      ENTRY_BACK: 0x015106         # options screen entry, after `clr.w $f160.w`
      ITEM_BACK: 0x0152CE          # left/right: the lea of the items' jump table
      MENU_EXIT: 0x01518E          # leave the options screen
      LEAVE_BACK: 0x015446         # button pressed, not on МЕНЮ: МУЗ./ЗВУК play their sound
      REFILL_BACK: 0x00E482        # potions routine, after the move it no longer runs
    hooks:
      menu:
        - [0x0150FE, "52 78 F1 02 42 78", draw]      # addq.w #1,$f102.w; clr.w $f160.w (first word)
        - [0x01525A, "D3 78 F1 60 6A 06", cursor]    # add.w d1,$f160.w; bpl.b $15266
        - [0x0152C8, "30 38 F1 60 D0 40", item]      # move.w $f160.w,d0; add.w d0,d0
        - [0x01543C, "0C 78 00 04 F1 60", leave]     # cmpi.w #4,$f160.w
        - [0x00E476, "4A 28 01 40 66 06", refill]    # tst.b $140(a0); bne.b $e482
    pointers:
      menu:
        - [0x0153D6, "C8 30", MUS_CELL]              # МУЗ. value: move.w #$c830,d0
        - [0x015422, "C9 B0", SND_CELL]              # ЗВУК value: move.w #$c9b0,d0
    strings: { section: labels, path: text/options.txt, label: LABELS }
    evidence: "options screen 0150A8-015128: labels drawn from the table 01512C (column, row, text, FF; moveq #8 = 9 labels), then 015110-015128 draw each value (d1 = 0) and the cursor (bra 01525A); cursor $F160 0..4 at 01525A-0152A6 (wraps at 015260/015266, column 7 cleared by 01207C with d0 = 440E0003, d2 = 0E, rows from the table 0152A8: 08 0B 10 13 16, tile A010); left/right 0152AE -> 0152C8 jump table 0152D8 (items 0-3, item 4 = rts at 0152E2); a button 01542C: cursor 4 leaves through 01518E, 2 / 3 play the music / sound; values drawn at C430 (difficulty), C830 / C9B0 (МУЗ. / ЗВУК: E030 + digit); other readers of $F160 belong to other screens (main menu 01377E, map 0170A0). Potions: 00E476 is the routine of constants.potions (callers 003EBA, 006984, 00E426, 00E6BE). POT $C729: of the long 0002CC / 0002E8 keeps over a soft reset ($C726 difficulty, $C727 buttons, $C728 used by the game), no instruction names $C729, watch FFC729 from boot through the options screen, stage 1, deaths and game over: written only by 0FFA7C, 0002DA (power-on clears) and 0002E8 (the soft-reset restore)"

  menus:
    source: patches/menus.s
    symbols:
      DRIFT: 0xBCC0                # frames until the clouds move again (byte; FFBCC0-FFBEFF never written after boot)
      DRIFT_FRAMES: 8
      DRIFT_STEP: 1                # pixels each move, every row alike (+: to the right, as the banner's clouds)
      SCROLL_BACK: 0x0155C2        # plane B scroll routine, after `lea $ff0002.l,a0`
      CURSOR_BACK: 0x01584A        # cursor tile upload, after `move.w #$10,d0`
      TM_CELL: 0x44AE0003          # VDP write command of plane A C4AE, where the game put "TM"
      INTRO_BACK: 0x014DE8         # title after the intro's slide, after that command
      SKIP_BACK: 0x014392          # title when START skips the intro
      OPTIONS_BACK: 0x0151D4       # main menu, back from the options
      SKY_KEPT: 0x0150B8           # options screen entry, after palette 0 is blacked out
      CLEAR: 0x0120E6              # clear plane A (the options screen's call)
      LABELS_TABLE: 0x01512C       # options labels: column, row, text, FF (text/menu.txt)
      LABELS_BACK: 0x0150D2        # options screen entry, after `lea $1512c(pc),a0`
      COPY_PAL: 0x01209E           # copy d7+1 words from a1 to a2
      MARKERS: 0x015A06            # character select: the table after its palettes (lea $15a06(pc),a0)
      SELECT_BACK: 0x015992        # character select, after `move.w #$c18e,d0`
      SELECT_SKY_TILE: 0x4EF       # VRAM 9DE0-A640 (67 tiles): never written on the 1- and 2-player select
      MODE: 0xF176                 # chosen game mode: 0 one player, 1 two, 2+ duel
      DUEL: 2
      MENU_BACK: 0x014EFA          # title -> main menu, after `move.l #$49960003,d0`
      TO_VDP: 0x01202E             # d0 (cell) -> VDP write command
      BAR_LEFT: 0xCD02             # plane A cell, row 26, column 1
      BAR_MIDDLE: 0xCD1C           # row 26, column 14: НАЖМИ СТАРТ, the menu's version
      BAR_RIGHT: 0xCD36            # row 26, column 27
      BAR_ATTR: 0xC000             # priority, palette 2 (colour 6: GREY)
      LEFT_WIDTH: 4                # characters (text/menus.txt)
      MIDDLE_WIDTH: 11
      RIGHT_WIDTH: 12
      GREY: 0x0A86                 # palette 2 colour 6: the banner's #7f94b3 (the game: $666)
      GOLD_ATTR: 0xA000            # priority, palette 1 (colour 6: a gold shade)
      BLANK: 0xE020                # the space glyph where the game wrote "TM"
      SKY_TILE: 0x1C0              # first tile of the sky (VRAM 3800): the game's 0F8-148 cannot hold it
      III_TOP: -60                 # "III": top of the art above the object's y (0F7: screen line 119)
      NOP: 0x4E71
    hooks:                         # [address, base-ROM bytes (hex), label]: each becomes jmp label.l
      code:
        - [0x0155BC, "41 F9 00 FF 00 02", drift]      # lea $ff0002.l,a0
        - [0x015842, "41 FA 00 18 30 3C", cursor]     # lea $1585c(pc),a0; move.w #$10,d0 (first word)
        - [0x014DDE, "23 FC 44 AE 00 03", bar_intro]  # move.l #$44ae0003,$c00004.l (first 6 of 10 bytes)
        - [0x014388, "23 FC 44 AE 00 03", bar_skip]   # the same
        - [0x0151CA, "23 FC 44 AE 00 03", bar_options]  # the same
        - [0x014EF4, "20 3C 49 96 00 03", menu]       # move.l #$49960003,d0
        - [0x0150A8, "30 3C 00 00 45 F8", options_sky]  # move.w #$0,d0; lea $f200.w,a2 (first word)
        - [0x0150CA, "61 00 D0 1A 41 FA", options_bar]  # bsr.w $120e6; lea $1512c(pc),a0 (first word)
        - [0x01598A, "41 FA 00 7A 30 3C", select_sky]   # lea $15a06(pc),a0; move.w #$c18e,d0 (first word)
    pointers:                      # [address, base-ROM bytes (hex), value]: the value replaces the bytes
      code:
        - [0x0158B8, "00 01 B7 80", LOGO_TILES]       # title tile list: the logo (tile 080)
        - [0x015632, "00 01 B7 80", LOGO_TILES]       # intro: lea $1b780.l,a0 (the 2x scroller's logo)
        - [0x017494, "00 01 B7 80", LOGO_TILES]       # ending tile list: the logo (tile 080)
        - [0x015776, "00 0E B4 90", LOGO_MAP]         # title: lea $eb490.l,a0 (38 x 6 cells at C104)
        - [0x0155F8, "00 0E B4 90", LOGO_MAP]         # intro: lea $eb490.l,a0
        - [0x0172E2, "00 0E B4 90", LOGO_MAP]         # ending: lea $eb490.l,a0
        - [0x0172F8, "00 0E B5 1C", TH_MAP]           # ending: lea $eb51c.l,a0 ("TH" of THE END, 8 x 6, the logo's tiles)
        - [0x01579E, "00 0E B2 00", LOGO_PAL]         # title: lea $eb200.l,a1 (palette 1, 12 colours)
        - [0x014D14, "00 0E B2 00", LOGO_PAL]         # title after the flash
        - [0x0144F6, "00 0E B2 00", LOGO_PAL]         # intro
        - [0x014508, "00 0E B2 00", LOGO_PAL]         # intro
        - [0x01568C, "00 0E B2 00", LOGO_PAL]         # intro: palette 0 (the scroller's logo)
        - [0x01569E, "00 0E B2 00", LOGO_PAL]         # intro
        - [0x0158BC, "00 F8", SKY_TILE]               # title tile list: the sky's first tile
        - [0x0158BE, "00 01 D0 D6", SKY_TILES]        # title tile list: the sky
        - [0x0157B6, "00 F8", SKY_TILE]               # title: move.w #$f8,d0, the sky map's base
        - [0x0157BA, "00 0E B5 E8", SKY_MAP]          # title: lea $eb5e8.l,a0 (32 x 28 cells, twice)
        - [0x0157F8, "00 0E B2 78", SKY_PAL]          # title: lea $eb278.l,a1 (palette 0)
        - [0x015801, "04", SKY_PAL_COLOURS-1]         # title: moveq #4,d7, the colours
        - [0x014D42, "00 0E B2 78", SKY_PAL]          # 014D40: lea $eb278.l,a0 (palette 0 after the flash)
        - [0x014D47, "04", SKY_PAL_COLOURS-1]         # 014D40: moveq #4,d7
        - [0x014D4A, "E2 48", NOP]                    # 014D40: lsr.w #1,d0, the sky is no longer halved
        - [0x0158D0, "00 01 D6 D2", III_TILES]        # title tile list: "III" (tile 17D)
        - [0x015886, "00 0E B7 DE", III_SPRITE]       # "III" object: mapping
        - [0x014394, "E0 54", BLANK]                  # "TM" (row 9, column 23) gone: it sat on the old "III"
        - [0x01439A, "E0 4D", BLANK]
        - [0x014DEA, "E0 54", BLANK]
        - [0x014DF0, "E0 4D", BLANK]
        - [0x0151D6, "E0 54", BLANK]
        - [0x0151DC, "E0 4D", BLANK]
        - [0x014EA6, "C9 96", BAR_MIDDLE]             # blinking title text: row 26, column 14 (was row 19)
        - [0x014EB9, "11", MIDDLE_WIDTH-1]            # its blank phase: moveq #$11,d7
        - [0x014EC9, "11", MIDDLE_WIDTH-1]            # its text phase
        - [0x014ECC, "E0 00", GOLD_ATTR]              # its colour: palette 1 (gold), was 3 (white)
        - [0x01581C, "06 66", GREY]                   # title: move.w #$666,$f2cc.w
        - [0x014E08, "06 66", GREY]                   # menu: move.w #$666,$f24c.w
        - [0x0150D3, "08", 7]                         # options labels: moveq #8,d7, the title is drawn by options_bar
        - [0x016484, "00 01", SELECT_SKY_TILE]        # character select tile list: the lava's tile 1 -> the sky's
        - [0x016486, "00 01 DB AC", SELECT_TILES]     # the lava's tiles -> the sky's
        - [0x0159D6, "40 01", SELECT_SKY_TILE+0x6000] # move.w #$4001,d0: the map's base, palette 3 (was 2)
        - [0x0159DA, "00 0E B8 08", SELECT_MAP]       # lea $eb808.l,a0: the lava's map -> the sky's (40 x 28)
    art:
      section: art
      planes:
        - { tiles: LOGO_TILES, max_tiles: 120,
            files: [[gfx/screens/title_logo.png, LOGO_MAP], [gfx/screens/ending_th.png, TH_MAP]] }
        - { tiles: SKY_TILES, max_tiles: 92, files: [[gfx/screens/title_sky.png, SKY_MAP]] }  # VRAM 3800-4380
        - { tiles: SELECT_TILES, max_tiles: 67, files: [[gfx/screens/select_sky.png, SELECT_MAP]] }
      sprites:
        - { tiles: III_TILES, file: gfx/screens/title_iii.png,
            pieces: [[0, 0, 4, 4], [4, 0, 4, 4], [8, 0, 2, 4], [0, 4, 4, 2], [4, 4, 4, 2], [8, 4, 2, 2]] }
      palettes:
        - { label: LOGO_PAL, file: gfx/screens/title_logo.png, colours: 12 }
        - { label: SKY_PAL, file: gfx/screens/title_sky.png, colours: 10 }
        - { label: SELECT_PAL, file: gfx/screens/select_sky.png, colours: 8 }
        - { label: DUEL_TITLE_PAL, file: gfx/screens/select_title.png, colours: 8 }
      raw:
        - { label: CURSOR_TILE, file: gfx/screens/title_cursor.png }
    strings: { section: text, path: text/menus.txt, label: BAR_TEXT }
    evidence: "title setup 0156B0-015840: Nemesis list 0158B4 (count-1, then tile word + source long: logo 1B780 at 080, sky 1D0D6 at 0F8, 1D3A8 at 149, 1D552 at 168, 1D6D2 at 17D) loaded by 012D1E; logo map 0EB490 Enigma (decoder 01252C, base d0) base A080 -> 38 x 6 cells at C104 (012042); palette 0EB200 (12 words) -> F2A0, sky map 0EB5E8 base 00F8 -> E000 and E040 (32 x 28 twice), sky palette 0EB278 (5 words) -> F280, text palette 0EB2A2 -> F2E0, $666 -> F2CC (palette 2 colour 6); cursor 32 bytes at 01585C -> tile 10 (015842); III object 01587C (mapping 0EB7DE, attr A17D, x 120 y F7; mapping: pieces-1, flag, then 8 bytes a piece read by the sprite builder 012964: y, size, tile, x, mirrored x, flipped y); intro 0155EC: map 0EB490 base 8002 and tiles 1B780 doubled by 013A40/01398A for 38 x 6 cells and 120 tiles, palette 0EB200 -> F200/F280; 014D40: 0EB278 halved into (a1) (callers 0143B4, 014D28, 0151EE); flash 014CE4 then 014D12 reloads 0EB200; ending 017212: list 017490 (logo 1B780 at 080), logo map at FF0000, map 0EB51C (48 words, logo tiles: the T and H of THE END, emulator) at FF01C8, drawn at 01741E (8 x 6 cells), then E, E, N, D copied out of the logo map by its 4-cell grid (01742E, table 01748C: 04 04 05 03, two blank cells after the first); plane B scroll 0155B2/0155B8 -> 0155BC: groups of rows (table 0155E2) step d0, d0 += d1; blink 014E98: every 32 frames 18 characters of 014EDA at C996 (attr E000) or blanks; TM E054 E04D at C4AE: 014392, 014DE8, 0151D4; title -> menu 014EEC: 01207C clears from C996, 27 x 6 cells; VRAM on the title: tiles end at 34A0 (dump, emu), 3800-4380 unused; Enigma maps round-trip with ga3.enigma (tests/test_enigma.py)"

constants:                       # numbers inside code (instruction operands), edited by name; see ga3.constants
  path: data/gameplay.yml
  values:
    lives:
      format: u8
      sites:                     # [instruction address, base-ROM bytes, operand offset]
        - [0x00E420, "11 7C 00 02 01 3C", 3]   # move.b #2,$13c(a0): a game starts
        - [0x00E6E8, "11 7C 00 02 01 3C", 3]   # the same after a continue
      max_hud: 9
      note: "spare lives of each player (object +0x13C), shown as one digit next to the portrait"
      evidence: "dumps every 300 frames while player 1 dies three times on stage 1: FFC8E0 (P1 object +0x13C) goes 2, 1, 0 with the HUD digit; watch FFC8E0: set by 00E420 when the stage starts, decremented by 00697A (subq.b #1,$13c(a0)) at each death; the only other writers of +0x13C are 00E6E8 (move.b #2, next to subq.b #1,$c77c.w: a continue), 003EC0 (subq) and 010416 (addq.b #1, an extra life)"
    credits:
      format: u8
      sites:
        - [0x0003B6, "11 FC 00 04 C7 7C", 3]   # move.b #4,$c77c.w
      note: "continues per game («КРЕДИТЫ 4» on the continue screen)"
      evidence: "watch FFC77C from boot: written once by 0003B6 (move.b #4,$c77c.w) when a game starts; 00E6CE subq.b #1,$c77c.w on each continue (with 00E6E8 restoring the lives); the continue screen shows «КРЕДИТЫ 4»; 00E624 / 00E68E test it for zero"
    potions:
      format: u8
      sites:
        - [0x00E47C, "11 7C 00 01 01 40", 3]   # move.b #1,$140(a0), after tst.b $140(a0); bne
      max: 6
      note: "default of OPTIONS -> БАНКИ МАГИИ (patch options, which bypasses this instruction and reads its operand): magic potions a player gets when they have none, at the start of a game, after a death and after a continue (object +0x140; a count above zero is kept); the HUD draws 6 as three full jars"
      evidence: "watch FFC8E4 (P1 object +0x140) from boot: cleared with the object (00E532, 00E55A), then 00E47C writes 1 when the game starts (with 00E420 setting the lives), at each death (with 00697A) and at a continue (with 00E6CE / 00E6E8) when the count is 0; with potions poked to 4 or 5 the same deaths and continue write nothing and the HUD keeps them; other writers: 000A20 (addq.b #1 on a pick-up, only below 6: cmpi.b #6 at 000A1A), 00F65A-00F67C (paying for a spell, docs/heroes.md), 00FCCC/00FCD4, 0004F6/000506 (a pad cheat on player 2); built with 6, the HUD shows three full jars at the start and A casts the level-2 spell, spending all six; poked to 9, the HUD draws garbage tiles (its tile table 0x0518EC is indexed by count x 2), hence max 6"

    countdown:
      format: u8
      sites:
        - [0x00E650, "13 7C 00 09 00 03", 3]   # move.b #9,$3(a1): the continue screen opens
      max_hud: 9
      note: "the continue screen's countdown, seconds from which it counts to zero (one digit on the screen); a count lasts countdown_frames frames, and A, B or C takes a second at once"
      evidence: "emu/scenes/game_over.txt with bp 00E650 / 00E720 / 00E726 (watchlog): after the third death 00E650 writes 9 to FFC783 (a1 = FFC780, the continue state) at frame 6045, 00E720 subq.b #1 every 60 frames (6105 .. 6585, nine times), 00E726 at 0 starts the game over (FFC784 = 0xB4, phase 4); the screen shows the digit (shots cd_9, cd_8, cd_7); 00E6CE subq.b #1,$c77c.w when a continue is taken"
    countdown_frames:
      format: u8
      sites:
        - [0x00E65C, "13 7C 00 3C 00 05", 3]   # move.b #$3c,$5(a1): the first second
        - [0x00E71A, "13 7C 00 3C 00 05", 3]   # the same after every count
      note: "frames a count of the continue countdown lasts (60: one second at 60 Hz); the byte at $5(a1) counts them down (00E714) unless A, B or C is pressed, which ends the second at once"
      evidence: "disasm 00E70E-00E724: andi.b #$70,d0 (the buttons) / bne; subq.b #1,$5(a1); bne; move.b #$3c,$5(a1); subq.b #1,$3(a1); the bp log above shows the count stepping every 60 frames"
    prisoners:
      format: u8
      sites:
        - [0x0103F2, "0C 29 00 05 01 3E", 3]         # cmpi.b #5,$13e(a1): enough prisoners freed?
        - [0x0103FA, "5B 29 01 3E", 0, quick]        # subq.b #5,$13e(a1): the life is paid
        - [0x0103FE, "13 7C 00 05 01 38", 3]         # move.b #5,$138(a1): icons shown while they blink
        - [0x010410, "11 7C 00 05 00 0E", 3]         # move.b #5,$e(a0): blinks
        - [0x0103CC, "13 7C 00 05 01 38", 3]         # move.b #5,$138(a1): icons shown again at each blink
      max: 8
      max_hud: 5
      note: "freed prisoners that earn a player an extra life (object +0x13E; the HUD draws up to 5 icons of +0x138); the same number of icons blinks that many times, and patch kill_counter reads it for its life every 100 kills (ICONS_SRC)"
      evidence: "0103B4 is the per-player HUD state routine, run every frame (docs/heroes.md, Lives): 0103EC copies +0x13E to the icons, 0103F2 compares it with 5, 0103FA subtracts 5, 010416 adds a life, 01041A plays sound DF; +0x13E is incremented at 00A2E4 / 00A2F2 when a chained villager is freed; in the emulator, poking FFC8E2 (P1 +0x13E) to 5 on stage 1 gives a life at once (FFC8E0 2 -> 3) with five blinking icons, poking 3 gives nothing; built with 3, poking 3 gives the life and three icons"
    magic_l0:
      format: u8
      sites:                     # byte table 0x00F91A, one entry per class (0..4) x level
        - [0x00F91A, "06", 0]
        - [0x00F91E, "06", 0]
        - [0x00F922, "06", 0]
        - [0x00F926, "06", 0]
        - [0x00F92A, "06", 0]
      max: 0x7F
      note: "damage of a level-0 spell (1-2 potions), to each of the four enemy slots; the same for every hero. From 0x80 the subtraction leaves a negative HP and the enemy dies at once"
      evidence: "lea $f91a,a1 at 00F892; index $DC52 = class x 4 + level (docs/heroes.md, Magic); the same bytes for every class, which the build keeps: all sites of a constant must agree"

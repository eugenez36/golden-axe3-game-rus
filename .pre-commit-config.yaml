repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # Capstone listings of the main code block reach ~750 KiB
      - id: end-of-file-fixer
        exclude: '\.(nem|4bpp|pcm|m68k|raw|ips|png)$|^emu/patches/'
      - id: trailing-whitespace
        # .tbl: the space glyph is the line `20= ` -- its trailing blank is the data
        exclude: '^assets/text/|\.(nem|4bpp|pcm|m68k|raw|ips|png|md|tbl)$|^emu/patches/'
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '\.(nem|4bpp|pcm|m68k|raw|ips|png)$|^emu/patches/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6  # same ruff as pyproject's [dev] extra; bump both together
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-rom-images
        name: refuse ROM images
        description: the same guard as the CI job — no *.bin/*.gen/*.smd, no 512 KiB+ file with a SEGA header
        language: script
        entry: .github/scripts/no-rom-images.sh
      - id: align-md-tables
        name: align Markdown tables
        description: pad every table column to its widest cell; docs/rom_map.md is generated and left as is
        language: script
        entry: .github/scripts/align-md-tables.py
        files: '\.md$'
        exclude: '^docs/rom_map\.md$|^emu/gpgx/'

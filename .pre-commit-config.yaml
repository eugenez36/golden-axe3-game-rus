repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]  # Capstone listings of the main code block reach ~750 KiB
      - id: end-of-file-fixer
        exclude: '\.(nem|4bpp|pcm|m68k|raw|ips|png)$|^emu/patches/'
      - id: trailing-whitespace
        exclude: '^assets/text/|\.(nem|4bpp|pcm|m68k|raw|ips|png|md)$|^emu/patches/'
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: '^emu/patches/'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-rom-images
        name: refuse ROM images
        description: the same guard as the CI job — no *.bin/*.gen/*.smd, no 512 KiB+ file with a SEGA header
        language: script
        entry: .github/scripts/no-rom-images.sh

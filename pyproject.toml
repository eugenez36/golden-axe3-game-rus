[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ga3"
version = "0.37.600"
description = "ROM-hacking toolkit for Golden Axe III (Sega Mega Drive) — NEWGAME 2003 Russian translation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eugene Zubovich" }]
keywords = ["sega", "mega-drive", "genesis", "romhacking", "nemesis", "golden-axe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: System :: Emulators",
]
dependencies = [
  "PyYAML>=6.0",
  "Pillow>=11.3",  # Image.get_flattened_data (ga3.screen, banner_art)
]

[project.optional-dependencies]
disasm = ["capstone==5.0.9"]
# keep the ruff pin in step with .pre-commit-config.yaml (see CONTRIBUTING.md)
dev = ["pytest>=8", "ruff>=0.16.6,<0.17", "pre-commit>=3"]

[project.scripts]
ga3 = "ga3.cli:main"

[project.urls]
Repository = "https://github.com/eugenez36/golden-axe3-game-rus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP031"]  # %-formatting of hex offsets ("%06X") reads better than :06X in this domain

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "rom: requires baserom/ga3.bin with the expected sha1 (skipped when absent)",
]

# Gameplay constants: numbers inside the game's code, edited by name.
# Where each one sits is in rom_map.yml (constants:); `ga3 balance` edits this file.
# lives (u8, at 00E420, 00E6E8): spare lives of each player (object +0x13C), shown as one digit next to the portrait
# credits (u8, at 0003B6): continues per game («КРЕДИТЫ 4» on the continue screen)
# potions (u8, at 00E47C): default of OPTIONS -> БАНКИ МАГИИ (patch options, which bypasses this instruction and reads its operand): magic potions a player gets when they have none, at the start of a game, after a death and after a continue (object +0x140; a count above zero is kept); the HUD draws 6 as three full jars
# countdown (u8, at 00E650): the continue screen's countdown, seconds from which it counts to zero (one digit on the screen); a count lasts countdown_frames frames, and A, B or C takes a second at once
# countdown_frames (u8, at 00E65C, 00E71A): frames a count of the continue countdown lasts (60: one second at 60 Hz); the byte at $5(a1) counts them down (00E714) unless A, B or C is pressed, which ends the second at once
# prisoners (u8, at 0103F2, 0103FA, 0103FE, 010410, 0103CC): freed prisoners that earn a player an extra life (object +0x13E; the HUD draws up to 5 icons of +0x138); the same number of icons blinks that many times, and patch kill_counter reads it for its life every 100 kills (ICONS_SRC)
# magic_l0 (u8, at 00F91A, 00F91E, 00F922, 00F926, 00F92A): damage of a level-0 spell (1-2 potions), to each of the four enemy slots; the same for every hero. From 0x80 the subtraction leaves a negative HP and the enemy dies at once
# magic_l1 (u8, at 00F91B, 00F91F, 00F923, 00F927, 00F92B): damage of a level-1 spell (3-5 potions), to each of the four enemy slots; the same for every hero. From 0x80 the subtraction leaves a negative HP and the enemy dies at once
# magic_l2 (u8, at 00F91C, 00F920, 00F924, 00F928, 00F92C): damage of a level-2 spell (6 potions), to each of the four enemy slots; the same for every hero. From 0x80 the subtraction leaves a negative HP and the enemy dies at once
# magic_team (u8, at 00F91D, 00F921, 00F925, 00F929, 00F92D): damage of the team spell (level 3: crossed weapons, 10 potions between the players), to each of the four enemy slots; the same for every hero. From 0x80 the subtraction leaves a negative HP and the enemy dies at once
# enemy_magic (u8, at 00F92E, 00F92F): damage an enemy's spell does to each player (the two bytes after the heroes' entries of 0x00F91A, index 0x14 + player)
# proud_hit (u8, at 0EEDC4): Proud: power of the first combo hit (B; damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# proud_super (u8, at 0EEDCC): Proud: power of the close combo finisher with Fwd, the launch (damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# kain_hit (u8, at 0EED6C): Kain: power of the first combo hit (B; damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# kain_super (u8, at 0EED72): Kain: power of the close combo finisher with Fwd, the launch (damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# chronos_hit (u8, at 0EEDF6): Chronos: power of the first combo hit (B; damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# chronos_super (u8, at 0EEDFC): Chronos: power of the close combo finisher with Fwd, the launch (damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# sarah_hit (u8, at 0EED92): Sarah: power of the first combo hit (B; damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# sarah_super (u8, at 0EED98): Sarah: power of the close combo finisher with Fwd, the launch (damage is half); shown on the character select (patch hero_panel). Above 0x64 the stamina meter misbehaves
# boss_song_1 (u8, at 0ED33E): song that starts when the stage 1 boss comes on screen
# boss_song_2a (u8, at 0ECED2): song that starts when the stage 2A boss comes on screen
# boss_song_2b (u8, at 0ED98C, 0ED8EA): song that starts when the stage 2B boss comes on screen
# boss_song_3a (u8, at 0ECC06, 0ECB54): song that starts when the stage 3A boss comes on screen
# boss_song_3b (u8, at 0EE78E): song that starts when the stage 3B boss comes on screen
# boss_song_4a (u8, at 0ED68C): song that starts when the stage 4A boss comes on screen
# boss_song_4b (u8, at 0EE4DA, 0EE3F4): song that starts when the stage 4B boss comes on screen
# boss_song_5a (u8, at 0EEA96, 0EEB4C): song that starts when the stage 5A boss comes on screen
# boss_song_5b (u8, at 0EE08A): song that starts when the stage 5B boss comes on screen
# boss_song_6a (u8, at 0EECC6): song that starts when the stage 6A boss comes on screen
# boss_song_6b (u8, at 0EDD12): song that starts when the stage 6B boss comes on screen
# boss_song_7 (u8, at 0EE7FE): song that starts when the stage 7 boss comes on screen
# boss_song_8 (u8, at 0ED186): song that starts when the final boss (stage 8, first form) comes on screen
# stage_clear_song (u8, at 00D9F8): stage cleared: the jingle before the next stage's screen
# game_over_song (u8, at 00D890): game over (the continue screen follows)
# duel_won_song (u8, at 00DBC4, 00DC20): a duel fight is over: player 1 beat the computer (00DBC4), or a two-player fight ended (00DC20)
# duel_lost_song (u8, at 00DBCA): a duel against the computer lost; the title follows
# boss_8_fall_song (u8, at 00B06A): stage 8: the first form of the final boss falls («Сны становятся явью!»)
# castle_song (u8, at 00DD56): stage 8: outside the castle with the freed prisoners
# lightning_song (u8, at 00BA56): stage 8: lightning strikes the castle, the sky goes dark; then stage_music.special_12 for the second form
# castle_fall_song (u8, at 00DF2C): the castle falls after the final boss's second form
# ending_song (u8, at 00DFDE): the ending's text pages («И вот наши храбрые вои…»)

# Hero stats panel on the character select (patch hero_panel, src/ga3/hero_panel.py).
# Heroes in select-cursor order (FFF315: 0 Chronos, 1 Kain, 2 Sarah, 3 Proud).
# The numbers come from the game's own tables, the files under `sources`
# (`ga3 balance` edits them): hp = hp_table slot_0 (every hero starts at max-HP
# level 0); hit / super = the constants KEY_hit / KEY_super of gameplay.yml
# (power of the first combo hit / of the close finisher with Fwd; damage is
# half); speed = walk_speed KEY_x, 8.8 pixels per frame, shown as px per second.
# tempo (seconds between combo hits, smaller is faster) is measured, not a table.
sources: {hp: data/hp_table.yml, constants: data/gameplay.yml, walk: data/walk_speed.yml}
heroes:
  - {name: Хронос Лайт, magic: ГРОЗА, key: chronos, tempo: 0.32}
  - {name: Каин Грайндер, magic: ВОДА, key: kain, tempo: 0.38}
  - {name: Сара Барн, magic: ОГОНЬ, key: sarah, tempo: 0.25}
  - {name: Прауд Крэггер, magic: ЗЕМЛЯ, key: proud, tempo: 0.50}
labels: {magic: "МАГИЯ: ", hp: ЗДОРОВЬЕ, hit: УДАР, tempo: ТЕМП, speed: СКОРОСТЬ}
# a full bar: the fastest tempo; hp (the top max-HP level), super and speed
# (the strongest and the fastest hero) come from the tables
bars: {tempo: 0.25}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 🛡️ No ROM in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on any ROM-like binary (same script as the pre-commit hook)
        run: git ls-files -z | xargs -0 .github/scripts/no-rom-images.sh && echo clean

  python:
    name: 🐍 Python toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,disasm]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests (ROM-gated tests are skipped without baserom/ga3.bin)
        run: pytest -q -m "not rom"

  assets:
    name: 🗺️ rom_map.yml and derived assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Map loads, covers the image, every committed asset exists
        run: |
          ga3 map --list
          python - <<'PY'
          import sys
          from ga3 import pipeline as pl
          proj = pl.open_project(".")
          missing = [s.path for s in proj.map.segments
                     if s.path and s.type in {"header","table","text","nemesis","pcm","raw"}
                     and not proj.paths.asset(s.path).exists()]
          missing += [s.get("blob") for s in proj.map.segments
                      if s.get("blob") and not proj.paths.asset(s.get("blob")).exists()]
          print("missing:", missing); sys.exit(1 if missing else 0)
          PY
      - name: Derived files are fresh (encoding.tbl, font.nem, docs/rom_map.md)
        run: ga3 assets refresh && git diff --exit-code
      - name: No committed file above 1 MiB
        run: |
          big=$(git ls-files | xargs -I{} stat -c '%s %n' {} | awk '$1 > 1048576')
          if [ -n "$big" ]; then echo "::error::oversized files:"; echo "$big"; exit 1; fi

  emulator:
    name: 🕹️ Headless Genesis Plus GX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential zlib1g-dev
      - name: Core carries the dma_hook
        run: make -C emu/headless check-core GPGX="$PWD/emu/gpgx"
      - name: Build
        run: make emu -j"$(nproc)" && build/emu/headless_gpgx --help 2>&1 | head -5
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: headless_gpgx-linux-x86_64
          path: build/emu/headless_gpgx
          retention-days: 14

  docs:
    name: 📜 Docs & branding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SVG banner is well-formed
        run: python3 -c "import xml.dom.minidom,glob; [xml.dom.minidom.parse(f) for f in glob.glob('docs/branding/*.svg')]; print('ok')"
      - name: Relative links resolve
        run: |
          set -euo pipefail
          fail=0
          for md in $(git ls-files '*.md'); do
            dir=$(dirname "$md")
            for link in $(grep -oE '\]\((\./)?[A-Za-z0-9_./-]+\)' "$md" | sed -E 's/\]\((\.\/)?//; s/\)$//'); do
              [ -e "$dir/$link" ] || [ -e "$link" ] || { echo "::error file=$md::broken link $link"; fail=1; }
            done
          done
          exit $fail
